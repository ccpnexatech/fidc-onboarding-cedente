name: pr

# Cobra as convenções do CLAUDE.md: Conventional Commits em pt-BR e o formato do PR (#31).
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  formato:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/check-pr.sh "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
