name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fidc
          POSTGRES_PASSWORD: fidc
          POSTGRES_DB: fidc
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U fidc"
          --health-interval 2s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://fidc:fidc@localhost:55432/fidc
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
        working-directory: api
      - run: make check
      - run: make conciliacao

  diagramas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npx -y puppeteer@23.11.1 browsers install chrome-headless-shell@131.0.6778.204
      - run: bash scripts/check-diagramas.sh

  homologacao:
    name: homologação (Newman)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
        working-directory: api
      - run: make newman
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: newman-junit
          path: api/reports/newman.xml
